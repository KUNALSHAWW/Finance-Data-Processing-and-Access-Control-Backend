# No secrets live in this file. Everything comes from environment variables.
spring.application.name=finance-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Required, no default: the app refuses to start without a 32+ byte secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Account lockout (OWASP ASVS V6.3.1 style)
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.security.lock-minutes=${LOCK_MINUTES:15}

# Optional first-admin bootstrap, only used when the users table is empty.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Comma-separated origins; empty means CORS is off.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Set DOCS_ENABLED=false in production to hide Swagger.
springdoc.api-docs.enabled=${DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${DOCS_ENABLED:true}

management.endpoints.web.exposure.include=health
