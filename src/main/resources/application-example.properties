# Server port configuration
server.port=8080
spring.application.name=finance-backend

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=your_username_here
spring.datasource.password=your_password_here

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# IMPORTANT: Replace with a strong secret key (minimum 256 bits / 32 characters)
# For production, use environment variables: ${JWT_SECRET}
app.jwt.secret=your_secret_key_here_must_be_at_least_32_characters_long
app.jwt.expiration-ms=3600000