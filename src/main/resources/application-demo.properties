# Public live demo: in-memory database seeded at every start (free hosting has no durable database).
# The same Flyway migration runs; point DB_URL at MySQL and drop this profile for real use.
spring.datasource.url=jdbc:h2:mem:demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
app.demo.enabled=true
# Demo data resets itself on this ISO-8601 interval
app.demo.reset-interval=PT30M
